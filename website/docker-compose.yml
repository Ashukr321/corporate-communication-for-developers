services:
  website:
    build:
      context: .. # repo root: the site renders the markdown guides next to website/
      dockerfile: website/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    image: devspeak-website
    container_name: devspeak-website
    ports:
      - "3000:3000"
    restart: unless-stopped
